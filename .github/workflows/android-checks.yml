name: Atlas Smart Connect Android checks

on:
  push:
    branches:
      - feature/atlas-game-connect-mvp
    paths:
      - "android/**"
      - ".github/workflows/android-checks.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run unit tests and assemble debug APK
        run: gradle -p android testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-smart-connect-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
