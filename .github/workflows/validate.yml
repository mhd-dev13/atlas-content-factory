name: Validate Atlas Smart Connect

on:
  pull_request:
    branches:
      - feature/atlas-game-connect-mvp
      - main
  push:
    branches:
      - codex/atlas-security-hardening

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Validate Worker bundle without deploying
        run: npm run check
